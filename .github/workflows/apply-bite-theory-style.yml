name: Apply Bite Theory style update

on:
  push:
    paths:
      - .github/workflows/apply-bite-theory-style.yml

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update colors and mobile logo
        shell: python
        run: |
          from pathlib import Path

          files = [Path("index.html"), Path("Bite-Theory-www-bitetheory-co.html")]
          replacements = {
              "--orange:#ff5a1f; --red:#e32636;": "--orange:#e32636; --red:#e32636;",
              "rgba(255,90,31,.27)": "rgba(227,38,54,.27)",
              "rgba(255,90,31,.08)": "rgba(227,38,54,.08)",
              ".bowls .tag{background:rgba(255,90,31,.18);color:#ff9c73}": ".bowls .tag{background:rgba(227,38,54,.18);color:#ff8893}",
              ".nav{height:66px}.brand{font-size:21px}.brand-logo{height:42px}": ".nav{height:92px;padding:12px 0}.brand{font-size:21px}.brand-logo{height:68px;max-width:220px;object-fit:contain}",
          }

          for path in files:
              content = path.read_text()
              for old, new in replacements.items():
                  if old not in content:
                      raise SystemExit(f"Expected styling not found in {path}: {old}")
                  content = content.replace(old, new)
              path.write_text(content)
      - name: Commit website update
        run: |
          git config user.name "ChatGPT Codex"
          git config user.email "codex@openai.com"
          git add index.html Bite-Theory-www-bitetheory-co.html
          git commit -m "Update Bite Theory red accents and mobile logo"
          git push
