name: Restore Bite Theory website page
on:
  push:
    paths:
      - '.github/workflows/bite-logo-32.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original website HTML
        run: |
          git show a00d259041b0e9121d2013b71d7e02981756832b:index.html > index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore Bite Theory website before logo edits"
            git push
          fi
